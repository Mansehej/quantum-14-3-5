name: q1736 distance-seven parent paired-coset CP-SAT

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/17-3-6/actions/d7_pair_cpsat.py'
      - '.github/workflows/q1736-d7-pair-cpsat.yml'

permissions:
  contents: read

jobs:
  paired-coset:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install OR-Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ortools
      - name: Run exact bounded-integer pairing model
        run: |
          mkdir -p q1736-d7-pair-results
          set -o pipefail
          python3 research/17-3-6/actions/d7_pair_cpsat.py \
            --seconds 19800 \
            --workers 4 \
            --seed '${{ matrix.seed }}' \
            --output "q1736-d7-pair-results/seed-${{ matrix.seed }}.json" \
            2>&1 | tee "q1736-d7-pair-results/seed-${{ matrix.seed }}.log"
      - name: Upload exact records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q1736-d7-pair-cpsat-seed-${{ matrix.seed }}
          path: q1736-d7-pair-results/**
          if-no-files-found: warn
          retention-days: 30
