name: I3322 Lean 4.32.1 build

on:
  push:
    branches:
      - i3322-lean-build-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: i3322-lean

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Extract formalization source
        working-directory: .
        run: |
          rm -rf i3322-lean
          mkdir i3322-lean
          tar -xzf i3322-lean-source.tar.gz -C i3322-lean

      - name: Install pinned Lean toolchain
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | \
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.32.1

      - name: Fetch Mathlib cache
        run: |
          lake update
          lake exe cache get

      - name: Reject prohibited proof constructs
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit|unsafe)([^[:alnum:]_]|$)|^[[:space:]]*(axiom|opaque)[[:space:]]' I3322 I3322.lean; then
            exit 1
          fi

      - name: Clean build and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .lake/build
          {
            echo '=== I3322 Lean clean build ==='
            date -u --iso-8601=seconds
            lean --version
            lake --version
            echo 'Lean toolchain:'
            cat lean-toolchain
            echo 'Pinned Mathlib commit: 520045ab14e26149ee970e2e617ca04b09bde5d6'
            echo '--- lake build ---'
            lake build
            echo '--- #print axioms ---'
            lake env lean I3322/AxiomCheck.lean
          } 2>&1 | tee BUILD_LOG.txt

      - name: Package exact release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f i3322-lean-v4.32.1.zip
          sha256sum lakefile.toml lean-toolchain I3322.lean I3322/*.lean \
            README.md FORMALIZATION_MANIFEST.md THEOREM_MAP.md AXIOM_REPORT.md \
            BUILD_LOG.txt > MANIFEST.sha256
          zip -r i3322-lean-v4.32.1.zip \
            lakefile.toml lean-toolchain lake-manifest.json I3322.lean I3322 \
            README.md FORMALIZATION_MANIFEST.md THEOREM_MAP.md AXIOM_REPORT.md \
            BUILD_LOG.txt MANIFEST.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: i3322-lean-v4.32.1
          path: i3322-lean/i3322-lean-v4.32.1.zip
          if-no-files-found: error
